<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Jady</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate&display=swap">
<style>
  /* --rule: lines above and below the name; --band: RGB of the band's fading gradient */
  :root{--bg:#faf1ea;--ink:#111;--model:#d9c6b4;--rule:#000;--band:255 255 255}
  @media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#faf1ea;--model:#3a332e;--rule:#fff;--band:0 0 0}}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  /* 3D model sits behind the text */
  #stage{position:fixed;inset:0;z-index:0;display:block;width:100%;height:100%}
  main{position:relative;z-index:1;height:100%;display:grid;align-content:center;gap:1rem;text-align:center;pointer-events:none}
  /* Band hugs the text: 1px rules, 12.5px padding, gradient clear at the edges and 50% in the middle */
  h1{font-family:Syncopate,"Helvetica Neue",Arial,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(1.3rem,3.8vw,2.2rem);display:inline-block;justify-self:center;white-space:nowrap;margin:0;padding:12.5px 0 12.5px .1em;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:linear-gradient(90deg,rgb(var(--band) / 0),rgb(var(--band) / .5) 50%,rgb(var(--band) / 0))}
  p{opacity:.7;margin:0;padding:0 16px}
  /* Name block on top, table centred beneath it at a medium size */
  .name{display:grid;gap:1rem;justify-items:center}
  .table{order:1;justify-self:center;height:min(34vh,320px);width:auto;max-width:calc(100% - 32px);margin-top:.75rem}
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<main>
  <img class="table" src="assets/table.webp" alt="Swirl side table in resin and oak with forged steel legs" width="1106" height="1400">
  <div class="name">
    <h1>Studio Jady</h1>
    <p>Coming soon.</p>
  </div>
</main>
<script src="assets/vendor/three.min.js"></script>
<script src="assets/vendor/GLTFLoader.js"></script>
<script>
(function () {
  if (!window.THREE) return;
  var canvas = document.getElementById('stage');
  // Opaque canvas; full Retina resolution so slow sub-pixel motion doesn't step along jagged edges
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0, 6);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x887766, 0.55));
  var key = new THREE.DirectionalLight(0xffffff, 0.6);
  key.position.set(3, 4, 5);
  scene.add(key);

  var material = new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.15, side: THREE.DoubleSide });
  function applyTheme() {
    var css = getComputedStyle(document.documentElement);
    renderer.setClearColor(new THREE.Color(css.getPropertyValue('--bg').trim()), 1);
    material.color.set(css.getPropertyValue('--model').trim());
  }
  applyTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  // Spinner holds the model; the model is centred and scaled to a fixed size inside it
  var spinner = new THREE.Group();
  scene.add(spinner);

  new THREE.GLTFLoader().load('assets/jady.glb', function (gltf) {
    var model = gltf.scene;
    model.traverse(function (o) { if (o.isMesh) o.material = material; });
    // The logo is modelled lying flat; stand it up to face the camera
    model.rotation.x = Math.PI / 2;
    var box = new THREE.Box3().setFromObject(model);
    var size = box.getSize(new THREE.Vector3());
    var scale = 3.2 / Math.max(size.x, size.y);
    model.scale.setScalar(scale);
    box.setFromObject(model);
    model.position.sub(box.getCenter(new THREE.Vector3()));
    spinner.add(model);
  });

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // Keep the model inside narrow (phone) screens
    camera.position.z = w < h ? 6 * (h / w) * 0.75 : 6;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // One full turn every LOOP seconds; the tilt shares the same phase so each loop ends where it began
  // Add #fps to the address to show the frame rate in the corner
  var fpsEl = null, frames = 0, lastFps = 0;
  if (location.hash === '#fps') {
    fpsEl = document.createElement('div');
    fpsEl.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:2;font:12px/1 ui-monospace,monospace;color:var(--ink);opacity:.6';
    document.body.appendChild(fpsEl);
  }

  // Driven by the frame timestamp, which is evenly spaced, so each frame advances by the same amount
  var LOOP = 30;
  renderer.setAnimationLoop(function (now) {
    var phase = (now / 1000 / LOOP) % 1 * Math.PI * 2;
    if (!still) {
      spinner.rotation.y = phase;
      spinner.rotation.x = Math.sin(phase) * 0.08;
    }
    renderer.render(scene, camera);
    if (fpsEl) {
      frames++;
      if (now - lastFps >= 1000) {
        fpsEl.textContent = Math.round(frames * 1000 / (now - lastFps)) + ' fps · ' + renderer.getPixelRatio() + 'x';
        frames = 0; lastFps = now;
      }
    }
  });
})();
</script>
</body>
</html>
