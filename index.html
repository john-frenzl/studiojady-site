<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Jady</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap">
<style>
  /* --rule: lines above and below the name; --band: RGB of the band's fading gradient */
  :root{--bg:#faf1ea;--ink:#111;--model:#d9c6b4;--rule:#000;--band:255 255 255}
  @media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#faf1ea;--model:#3a332e;--rule:#fff;--band:0 0 0}}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  /* Pre-rendered 30s seamless spin (smooth on every device). Light: multiply drops the white
     background into the page colour. Dark: invert + hue-rotate keeps the warm tint, screen drops the black */
  #stage{position:fixed;z-index:0;left:50%;top:50%;width:max(100vw,177.78vh);height:auto;transform:translate(-50%,calc(-50% - 15.5vh));opacity:.5;mix-blend-mode:multiply;pointer-events:none}
  @media (orientation:portrait){#stage{width:260vw}}
  @media (prefers-color-scheme:dark){#stage{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen}}
  main{position:relative;z-index:1;height:100%;display:grid;align-content:center;gap:1rem;text-align:center;pointer-events:none}
  /* Band hugs the text: 1px rules, 12.5px padding, gradient clear at the edges and 50% in the middle */
  h1{font-family:Syncopate,"Helvetica Neue",Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(1.3rem,3.8vw,2.2rem);display:inline-block;justify-self:center;white-space:nowrap;margin:0;padding:12.5px 0 12.5px .1em;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:linear-gradient(90deg,rgb(var(--band) / 0),rgb(var(--band) / .5) 50%,rgb(var(--band) / 0))}
  p{opacity:.7;margin:0;padding:0 16px}
  /* Name block on top, table centred beneath it at a medium size */
  .name{display:grid;gap:1rem;justify-items:center}
  .table{order:1;justify-self:center;height:min(34vh,320px);width:auto;max-width:calc(100% - 32px);margin-top:.75rem}
</style>
</head>
<body>
<video id="stage" src="assets/jady-spin.mp4" poster="assets/jady-spin-poster.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
<main>
  <img class="table" src="assets/table.webp" alt="Swirl side table in resin and oak with forged steel legs" width="1106" height="1400">
  <div class="name">
    <h1>Studio Jady</h1>
    <p>Coming soon.</p>
  </div>
</main>
<script>
  // Respect reduced-motion: hold the first frame
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var v = document.getElementById('stage'); v.removeAttribute('autoplay'); v.pause();
  }
</script>
</body>
</html>
