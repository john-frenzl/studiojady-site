<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Jady</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&display=swap">
<style>
  /* --rule: lines above and below the name; --band: RGB of the band's fading gradient */
  :root{--bg:#faf1ea;--ink:#111;--model:#d9c6b4;--rule:#000;--band:255 255 255}
  @media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#faf1ea;--model:#3a332e;--rule:#fff;--band:0 0 0}}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  /* 3D model sits behind the text */
  #stage{position:fixed;inset:0;z-index:0;display:block;width:100%;height:100%}
  main{position:relative;z-index:1;height:100%;display:grid;align-content:center;gap:1rem;text-align:center;pointer-events:none}
  /* Full-width band: 1px rules, 25px padding, gradient clear at the edges and 50% in the middle */
  /* Copperplate ships with macOS and Office; Marcellus SC is the free stand-in elsewhere */
  h1{font-family:Copperplate,"Copperplate Gothic Light","Copperplate Gothic","Marcellus SC",serif;font-weight:400;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(1.9rem,5.5vw,3.2rem);margin:0;padding:25px 16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:linear-gradient(90deg,rgb(var(--band) / 0),rgb(var(--band) / .5) 50%,rgb(var(--band) / 0))}
  p{opacity:.7;margin:0;padding:0 16px}
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<main>
  <h1>Studio Jady</h1>
  <p>Coming soon.</p>
</main>
<script src="assets/vendor/three.min.js"></script>
<script src="assets/vendor/GLTFLoader.js"></script>
<script>
(function () {
  if (!window.THREE) return;
  var canvas = document.getElementById('stage');
  // Opaque canvas and a capped pixel ratio keep each frame cheap so motion stays steady
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.outputEncoding = THREE.sRGBEncoding;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0, 6);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x887766, 0.55));
  var key = new THREE.DirectionalLight(0xffffff, 0.6);
  key.position.set(3, 4, 5);
  scene.add(key);

  var material = new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.15, side: THREE.DoubleSide });
  function applyTheme() {
    var css = getComputedStyle(document.documentElement);
    renderer.setClearColor(new THREE.Color(css.getPropertyValue('--bg').trim()), 1);
    material.color.set(css.getPropertyValue('--model').trim());
  }
  applyTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  // Spinner holds the model; the model is centred and scaled to a fixed size inside it
  var spinner = new THREE.Group();
  scene.add(spinner);

  new THREE.GLTFLoader().load('assets/jady.glb', function (gltf) {
    var model = gltf.scene;
    model.traverse(function (o) { if (o.isMesh) o.material = material; });
    // The logo is modelled lying flat; stand it up to face the camera
    model.rotation.x = Math.PI / 2;
    var box = new THREE.Box3().setFromObject(model);
    var size = box.getSize(new THREE.Vector3());
    var scale = 3.2 / Math.max(size.x, size.y);
    model.scale.setScalar(scale);
    box.setFromObject(model);
    model.position.sub(box.getCenter(new THREE.Vector3()));
    spinner.add(model);
  });

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // Keep the model inside narrow (phone) screens
    camera.position.z = w < h ? 6 * (h / w) * 0.75 : 6;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // One full turn every LOOP seconds; the tilt shares the same phase so each loop ends where it began
  // Uses the frame timestamp from requestAnimationFrame, which is evenly spaced, so steps don't jitter
  var LOOP = 30;
  function tick(now) {
    var phase = ((now || 0) / 1000 / LOOP) % 1 * Math.PI * 2;
    if (!still) {
      spinner.rotation.y = phase;
      spinner.rotation.x = Math.sin(phase) * 0.08;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
