<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Jady</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap">
<style>
  /* --rule: lines above and below the name; --band: RGB of the band's fading gradient */
  :root{--bg:#fff;--ink:#111;--model:#d9c6b4;--rule:#000;--band:255 255 255}
  @media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#faf1ea;--model:#3a332e;--rule:#fff;--band:0 0 0}}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  /* Pre-rendered 30s seamless spin (smooth on every device), rendered on the page colour for each theme so no blending is needed */
  #stage{position:fixed;z-index:0;left:50%;top:50%;width:max(100vw,177.78vh);height:auto;transform:translate(-50%,calc(-50% - 15.5vh));opacity:.5;pointer-events:none}
  /* On tall screens the video is shorter than the screen, so soften its top and bottom edges */
  @media (orientation:portrait){#stage{width:260vw;-webkit-mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent)}}
  main{position:relative;height:100%;display:grid;align-content:center;gap:1rem;text-align:center;pointer-events:none}
  /* Band hugs the text: 1px rules, 12.5px padding, gradient clear at the edges and 50% in the middle */
  h1{font-family:Syncopate,"Helvetica Neue",Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(1.3rem,3.8vw,2.2rem);display:inline-block;justify-self:center;white-space:nowrap;margin:0;padding:12.5px 0 12.5px .1em;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:linear-gradient(90deg,rgb(var(--band) / 0),rgb(var(--band) / .5) 50%,rgb(var(--band) / 0))}
  p{opacity:.7;margin:0;padding:0 16px}
  /* Name block on top, table centred beneath it; main has no z-index so it shares a layer with the spin */
  .name{display:grid;gap:1rem;justify-items:center}
  /* Two copies of the table stacked: hard light underneath, soft light on top */
  .tables{order:1;justify-self:center;display:grid;max-width:calc(100% - 32px);margin-top:.75rem}
  .table{grid-area:1/1;height:min(34vh,320px);width:auto;max-width:100%;mix-blend-mode:hard-light}
  .table-soft{mix-blend-mode:soft-light}
</style>
</head>
<body>
<video id="stage" src="assets/jady-spin-light.mp4" poster="assets/jady-spin-light-poster.jpg" data-dark-src="assets/jady-spin-dark.mp4" data-dark-poster="assets/jady-spin-dark-poster.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
<main>
  <div class="tables"><img class="table" src="assets/table.webp" alt="Swirl side table in resin and oak with forged steel legs" width="1121" height="1400"><img class="table table-soft" src="assets/table.webp" alt="" aria-hidden="true" width="1121" height="1400"></div>
  <div class="name">
    <h1>Studio Jady</h1>
    <p>Coming soon.</p>
  </div>
</main>
<script>
  // Pick the light or dark render to match the theme; hold the first frame for reduced motion
  (function () {
    var v = document.getElementById('stage');
    var light = { src: v.getAttribute('src'), poster: v.getAttribute('poster') };
    var dark = { src: v.dataset.darkSrc, poster: v.dataset.darkPoster };
    var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var scheme = window.matchMedia('(prefers-color-scheme: dark)');
    function apply() {
      var pick = scheme.matches ? dark : light;
      if (v.getAttribute('src') === pick.src) return;
      var t = v.currentTime;
      v.poster = pick.poster; v.src = pick.src;
      v.addEventListener('loadedmetadata', function () { v.currentTime = t; if (!still) v.play(); }, { once: true });
    }
    if (still) { v.removeAttribute('autoplay'); v.pause(); }
    apply();
    scheme.addEventListener('change', apply);
  })();
</script>
</body>
</html>
